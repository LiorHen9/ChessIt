name: Deploy to Firebase Hosting

# Every push to main builds the site and publishes it to https://chessit-liorhen9.web.app
# (Hosting site chessit-liorhen9 in the Firebase project chessit-6d389). The project's first site,
# https://chessit-6d389.web.app, gets the "ChessIt moved" notice instead (legacy-pages/, see
# firebase.json): the new link, a backup of the data stored at the old address, how to restore.
# Needs the FIREBASE_SERVICE_ACCOUNT secret (docs/FIREBASE.md, part ד; the same key the
# room clean-up uses). The service account also needs the "Firebase Hosting Admin" role (part ו).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing the FIREBASE_SERVICE_ACCOUNT secret – see docs/FIREBASE.md, part ד"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        # Firebase serves the site at the root of the domain, so the default base (/) is right.
        run: npm run build

      - name: Put together the notice for the old address
        run: bash scripts/legacy-site.sh / legacy-site

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chessit-6d389
          channelId: live
